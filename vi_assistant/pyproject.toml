[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vi-voice-assistant"
version = "0.1.0"
description = "Trợ lý giọng nói tiếng Việt sử dụng Pipecat AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[daily,whisper,piper,websocket]>=1.3.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
]

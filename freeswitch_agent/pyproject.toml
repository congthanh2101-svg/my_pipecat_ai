[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "freeswitch-voice-agent"
version = "0.1.0"
description = "Voice AI agent cho FreeSWITCH mod_audio_stream sử dụng Pipecat AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[whisper,piper]>=1.3.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "numpy>=1.24.0",
    "python-multipart>=0.0.32",
    "chromadb>=1.5.0",
    "sentence-transformers>=2.0.0",
]
